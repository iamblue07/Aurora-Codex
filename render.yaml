# Render Blueprint for the API (Dashboard → New → Blueprint → this repository, branch main).
# Values marked `sync: false` are asked for once, when the Blueprint is created; they are never
# stored in the repository. The client is on Vercel, uploads on Cloudflare R2, MySQL elsewhere.
services:
  # --- API: Node.js + Express -------------------------------------------------------------------
  - type: web
    name: aurora-codex-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The scraper's headless Chrome needs more memory than the free plan offers:
      # skip its ~170 MB download (the admin panel then shows the scraper as unavailable).
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"

      # Database: your hosted MySQL 8 provider's connection details.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "true"

      # A fresh random secret that signs login tokens (never reuse an old one).
      - key: SECRET_KEY
        generateValue: true

      # The client's address on Vercel, allowed by CORS, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false

      # Uploads (avatars, listing photos, chat files) on Cloudflare R2: the free plan has no disk.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Public bucket URL (r2.dev subdomain or custom domain), e.g. https://pub-xxxx.r2.dev
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_FOLDER
        value: aurora-codex

      # Optional services: leave empty to disable.
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false

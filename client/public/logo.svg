<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aurora Codex">
  <defs>
    <linearGradient id="ac-sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#081430"/>
      <stop offset="0.6" stop-color="#0f1a3d"/>
      <stop offset="1" stop-color="#1d1348"/>
    </linearGradient>
    <!-- like a real aurora: green at the lower hem, cyan and violet higher up, fading into the night -->
    <linearGradient id="ac-curtain" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ac-curtain-2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#6ee7b7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ac-hem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.6" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="ac-ray" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="6">
      <stop offset="0" stop-color="#ecfdf5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ecfdf5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ac-glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfff2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- polar night -->
  <rect width="64" height="64" rx="15" fill="url(#ac-sky)"/>
  <g fill="#e8f2ff">
    <circle cx="12" cy="10" r="1" opacity="0.85"/>
    <circle cx="51" cy="8" r="0.9" opacity="0.8"/>
    <circle cx="30" cy="6" r="0.6" opacity="0.6"/>
    <circle cx="57" cy="30" r="0.6" opacity="0.5"/>
    <circle cx="6.5" cy="27" r="0.6" opacity="0.5"/>
  </g>

  <!-- two aurora curtains sweeping across the sky -->
  <path fill="url(#ac-curtain-2)"
        d="M7 22 C 15 17, 22 21, 30 16 S 47 9, 57 12 L 57 2 C 47 -1, 38 5, 30 6 S 15 4, 7 10 Z"/>
  <path fill="url(#ac-curtain)"
        d="M6 33 C 14 27, 21 32, 30 26 S 47 17, 58 21 L 58 5 C 48 2, 39 9, 30 10 S 14 9, 6 15 Z"/>
  <!-- vertical rays of the curtain -->
  <g stroke="url(#ac-ray)" stroke-width="0.8" stroke-linecap="butt" fill="none">
    <path d="M14 28.6 L 14 19"/>
    <path d="M26 27.6 L 26 15"/>
    <path d="M36 22.6 L 36 12"/>
    <path d="M47 19.4 L 47 10"/>
  </g>
  <!-- bright lower hem of the main curtain -->
  <path d="M6 33 C 14 27, 21 32, 30 26 S 47 17, 58 21" fill="none" stroke="url(#ac-hem)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- light spilling onto the codex -->
  <ellipse cx="32" cy="40" rx="22" ry="9" fill="url(#ac-glow)"/>

  <!-- the codex: an open bound book, with the page block underneath -->
  <path d="M32 55 C 26 51.5, 18.5 50.7, 10.5 52.1 L 10.5 39.5 C 18.5 37.9 26 38.9 32 42.5 C 38 38.9 45.5 37.9 53.5 39.5 L 53.5 52.1 C 45.5 50.7 38 51.5 32 55 Z" fill="#7f95b8"/>
  <path d="M32 53 C 26 49.5, 18.5 48.7, 11 50.1 L 11 37.5 C 18.5 35.9 26 36.9 32 40.5 Z" fill="url(#ac-page)"/>
  <path d="M32 53 C 38 49.5, 45.5 48.7, 53 50.1 L 53 37.5 C 45.5 35.9 38 36.9 32 40.5 Z" fill="url(#ac-page)"/>
  <path d="M32 40.5 L 32 53" stroke="#081430" stroke-width="1.3" stroke-linecap="round"/>
  <g stroke="#0e7490" stroke-width="1.1" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M15 41.7 C 19 40.9, 23 41.3, 27 42.7"/>
    <path d="M15 45.1 C 19 44.3, 23 44.7, 27 46.1"/>
    <path d="M37 42.7 C 41 41.3, 45 40.9, 49 41.7"/>
    <path d="M37 46.1 C 41 44.7, 45 44.3, 49 45.1"/>
  </g>
</svg>
